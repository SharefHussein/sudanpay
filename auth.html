<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudan Pay - إنشاء حساب جديد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --secondary: #0891b2;
            --accent: #10b981;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --light: #f8fafc;
            --gray: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-container {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            padding: 50px 40px;
            text-align: center;
        }

        .logo {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2rem;
            color: var(--dark);
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--gray);
            margin-bottom: 40px;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 1.2rem;
        }

        input {
            width: 100%;
            padding: 18px 60px 18px 20px;
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 1.1rem;
            transition: all 0.3s;
            background: #f8fafc;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.1);
        }

        .password-toggle {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
        }

        .btn-primary {
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin: 10px 0 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 20px rgba(13, 148, 136, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(13, 148, 136, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            color: var(--gray);
            font-size: 1rem;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }

        .auth-footer a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .password-strength {
            margin-top: 8px;
            font-size: 0.9rem;
            color: var(--gray);
            text-align: right;
        }

        .password-strength.strong {
            color: var(--success);
        }

        .password-strength.medium {
            color: var(--warning);
        }

        .password-strength.weak {
            color: var(--danger);
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 40px 25px;
                margin: 10px;
            }
            
            .logo {
                font-size: 3.5rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            input, .btn-primary {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="logo">
            <i class="fas fa-user-plus"></i>
        </div>
        
        <h1>إنشاء حساب جديد</h1>
        <p class="subtitle">انضم إلى Sudan Pay وابدأ رحلتك المالية الآمنة</p>
        
        <div class="input-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="name" placeholder="الاسم الكامل (اختياري)">
        </div>
        
        <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" placeholder="البريد الإلكتروني" required>
        </div>
        
        <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <button type="button" class="password-toggle" onclick="togglePassword('password')">
                <i class="fas fa-eye"></i>
            </button>
            <input type="password" id="password" placeholder="كلمة المرور (6 أحرف على الأقل)" required minlength="6">
            <div id="password-strength" class="password-strength"></div>
        </div>
        
        <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                <i class="fas fa-eye"></i>
            </button>
            <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور" required>
        </div>
        
        <button id="signup-btn" class="btn-primary">
            <i class="fas fa-user-plus"></i> إنشاء الحساب
        </button>
        
        <div class="auth-footer">
            <p>لديك حساب بالفعل؟ <a href="index.html">سجل الدخول الآن</a></p>
        </div>
    </div>

    <script type="module">
        import { signUpWithEmail, showAlert } from './app.js';
        
        // دالة تبديل كلمة المرور
        function togglePassword(fieldId) {
            const passwordInput = document.getElementById(fieldId);
            const toggleIcon = passwordInput.parentElement.querySelector('.password-toggle i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'fas fa-eye';
            }
        }
        
        // دالة التحقق من قوة كلمة المرور
        function checkPasswordStrength(password) {
            const strengthText = document.getElementById('password-strength');
            
            if (password.length === 0) {
                strengthText.textContent = '';
                strengthText.className = 'password-strength';
                return;
            }
            
            if (password.length < 6) {
                strengthText.textContent = 'ضعيفة جداً';
                strengthText.className = 'password-strength weak';
                return 'weak';
            }
            
            let score = 0;
            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;
            
            if (score <= 1) {
                strengthText.textContent = 'ضعيفة';
                strengthText.className = 'password-strength weak';
                return 'weak';
            } else if (score <= 3) {
                strengthText.textContent = 'متوسطة';
                strengthText.className = 'password-strength medium';
                return 'medium';
            } else {
                strengthText.textContent = 'قوية';
                strengthText.className = 'password-strength strong';
                return 'strong';
            }
        }
        
        // دالة إنشاء حساب
        async function handleSignup() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const signupBtn = document.getElementById('signup-btn');
            
            // التحقق من البيانات
            if (!email || !password || !confirmPassword) {
                showAlert('الرجاء إكمال جميع الحقول الإلزامية');
                return;
            }
            
            if (password.length < 6) {
                showAlert('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
                return;
            }
            
            if (password !== confirmPassword) {
                showAlert('كلمات المرور غير متطابقة');
                return;
            }
            
            // التحقق من صحة البريد الإلكتروني
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('البريد الإلكتروني غير صالح');
                return;
            }
            
            try {
                signupBtn.innerHTML = '<div class="loading"></div> جاري إنشاء الحساب...';
                signupBtn.disabled = true;
                
                const result = await signUpWithEmail(email, password, name);
                showAlert(`تم إنشاء الحساب بنجاح! رقم حسابك: ${result.accountID}`, 'success');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
                
            } catch (error) {
                signupBtn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء الحساب';
                signupBtn.disabled = false;
                
                let errorMessage = 'حدث خطأ أثناء إنشاء الحساب';
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'هذا البريد الإلكتروني مستخدم بالفعل';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'كلمة المرور ضعيفة جداً';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'البريد الإلكتروني غير صالح';
                } else if (error.code === 'auth/operation-not-allowed') {
                    errorMessage = 'عملية التسجيل معطلة مؤقتاً';
                }
                
                showAlert(errorMessage);
            }
        }
        
        // ربط الأحداث
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('signup-btn').addEventListener('click', handleSignup);
            
            // التحقق من قوة كلمة المرور أثناء الكتابة
            document.getElementById('password').addEventListener('input', (e) => {
                checkPasswordStrength(e.target.value);
            });
            
            // إنشاء حساب بالضغط على Enter
            document.getElementById('confirmPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleSignup();
                }
            });
        });
        
        // جعل الدوال متاحة عالمياً
        window.togglePassword = togglePassword;
    </script>
</body>
  </html>
