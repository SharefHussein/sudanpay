<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SudanPay | إنشاء حساب</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <img src="logo.png" alt="SudanPay" class="auth-logo">
    <h2 class="text-3xl font-bold mb-8">إنشاء حساب جديد</h2>

    <input id="email" type="email" placeholder="البريد الإلكتروني" class="auth-input">
    <input id="password" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" class="auth-input">

    <button onclick="signUpEmail()" class="btn-main mb-6">إنشاء الحساب</button>

    <p class="toggle-link">
      لديك حساب بالفعل؟ <a href="login.html" class="text-teal-600 font-bold">تسجيل الدخول</a>
    </p>
  </div>

  <script type="module" src="auth-logic.js"></script>
</body>
</html>
