<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SudanPay | تسجيل الدخول</title>
<link rel="stylesheet" href="style.css">
</head>

<body style="display:flex;justify-content:center;align-items:center;height:100vh;background:#f5f5f5;">

<div style="background:white;padding:25px;border-radius:10px;width:320px;text-align:center;">
  <img src="logo.png" width="120"><br><br>

  <h3 id="auth-title">تسجيل الدخول</h3>

  <input id="email" type="email" placeholder="البريد الإلكتروني" style="width:100%;padding:8px;margin:5px 0;">
  <input id="password" type="password" placeholder="كلمة المرور" style="width:100%;padding:8px;margin:5px 0;">

  <button id="login-btn" style="width:100%;padding:10px;">دخول</button>
  <button id="google-btn" style="width:100%;padding:10px;margin-top:5px;background:#db4437;color:white;">
    الدخول عبر Google
  </button>

  <a href="#" id="toggle-auth" style="display:block;margin-top:10px;">
    ليس لديك حساب؟ إنشاء حساب
  </a>
</div>

<script type="module" src="auth-logic.js"></script>
</body>
</html>
