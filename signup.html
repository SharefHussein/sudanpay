<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - Sudan Pay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="glass-card w-full max-w-md p-8 text-center shadow-2xl">
        <h1 class="text-3xl font-black mb-2 italic">حساب <span class="text-[#a3e635]">جديد</span></h1>
        <p class="text-gray-500 text-sm mb-8">ابدأ رحلتك المالية مع السودان بي</p>
        
        <div class="space-y-4">
            <div class="relative">
                <i class="fas fa-user absolute right-4 top-4 text-gray-600 text-xs"></i>
                <input type="text" id="regName" placeholder="الاسم الكامل" 
                       class="w-full p-4 pr-12 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-[#a3e635] text-sm transition">
            </div>

            <div class="relative">
                <i class="fas fa-envelope absolute right-4 top-4 text-gray-600 text-xs"></i>
                <input type="email" id="regEmail" placeholder="البريد الإلكتروني" 
                       class="w-full p-4 pr-12 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-[#a3e635] text-sm transition">
            </div>
            
            <div class="relative">
                <i class="fas fa-lock absolute right-4 top-4 text-gray-600 text-xs"></i>
                <input type="password" id="regPassword" placeholder="كلمة المرور (6 خانات على الأقل)" 
                       class="w-full p-4 pr-12 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-[#a3e635] text-sm transition">
            </div>
        </div>
        
        <button onclick="handleSignUp()" class="w-full py-4 bg-[#a3e635] text-black font-black rounded-2xl shadow-lg shadow-lime-500/20 mt-8 transition active:scale-95">
            إنشاء الحساب
        </button>

        <p class="mt-8 text-xs text-gray-500 font-bold">
            لديك حساب بالفعل؟ <a href="login.html" class="text-white hover:text-[#a3e635]">تسجيل الدخول</a>
        </p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <script src="app.js"></script>

    <script>
        async function handleSignUp() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPassword').value;

            if(!name || !email || !pass) {
                showNotify("الرجاء إكمال كافة البيانات", "error");
                return;
            }

            try {
                // 1. إنشاء الحساب في Authentication
                const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
                const user = userCredential.user;

                // 2. حفظ بيانات المستخدم في Firestore
                await db.collection("users").doc(user.uid).set({
                    name: name,
                    email: email,
                    balance: 0, // الرصيد الابتدائي
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showNotify("تم التسجيل بنجاح! جاري توجيهك...", "success");
                setTimeout(() => window.location.href = "dashboard.html", 2000);

            } catch (error) {
                let errorMsg = "حدث خطأ أثناء التسجيل";
                if(error.code === "auth/email-already-in-use") errorMsg = "هذا البريد مسجل مسبقاً";
                if(error.code === "auth/weak-password") errorMsg = "كلمة المرور ضعيفة جداً";
                showNotify(errorMsg, "error");
            }
        }
    </script>
</body>
</html>
