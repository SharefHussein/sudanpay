<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول - Sudan Pay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0b0e14] flex flex-col items-center justify-center min-h-screen p-6">
    <div class="w-full max-w-sm p-8 bg-[#161b22] border border-[#a3e635]/20 rounded-2xl text-center">
        <h2 class="text-3xl font-bold mb-8 text-[#a3e635]">تسجيل الدخول</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-4 mb-4 bg-white/5 border border-white/10 rounded-xl text-white outline-none focus:border-[#a3e635]">
        <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-4 mb-6 bg-white/5 border border-white/10 rounded-xl text-white outline-none focus:border-[#a3e635]">
        
        <button onclick="login()" class="w-full py-4 bg-[#a3e635] text-black font-black rounded-xl mb-4 shadow-[0_0_20px_rgba(163,230,53,0.3)]">دخول</button>
        
        <button onclick="loginWithGoogle()" class="w-full py-3 bg-white text-black font-bold rounded-xl flex items-center justify-center gap-2">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            بواسطة جوجل
        </button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
