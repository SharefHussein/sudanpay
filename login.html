<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Sudan Pay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="glass-card w-full max-w-md p-8 text-center shadow-2xl">
        <h1 class="text-3xl font-black mb-2 italic">Sudan<span class="text-[#a3e635]">Pay</span></h1>
        <p class="text-gray-500 text-sm mb-8 italic">مرحباً بك في مستقبل الدفع الرقمي</p>
        
        <div class="space-y-4">
            <div class="relative">
                <i class="fas fa-envelope absolute right-4 top-4 text-gray-600 text-xs"></i>
                <input type="email" id="email" placeholder="البريد الإلكتروني" 
                       class="w-full p-4 pr-12 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-[#a3e635] text-sm transition">
            </div>
            
            <div class="relative">
                <i class="fas fa-lock absolute right-4 top-4 text-gray-600 text-xs"></i>
                <input type="password" id="password" placeholder="كلمة المرور" 
                       class="w-full p-4 pr-12 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-[#a3e635] text-sm transition">
            </div>
        </div>
        
        <button onclick="login()" class="w-full py-4 bg-[#a3e635] text-black font-black rounded-2xl shadow-lg shadow-lime-500/20 mt-8 transition active:scale-95">
            دخول
        </button>

        <button onclick="loginWithGoogle()" class="w-full py-4 mt-4 glass-card border border-white/10 flex items-center justify-center gap-3 rounded-2xl font-bold text-xs transition active:scale-95">
            <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png" class="w-5 h-5"> 
            تسجيل الدخول عبر جوجل
        </button>

        <p class="mt-8 text-xs text-gray-500 font-bold">
            ليس لديك حساب؟ <a href="signup.html" class="text-white hover:text-[#a3e635]">اشترك مجاناً</a>
        </p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
