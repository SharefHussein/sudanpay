<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SudanPay - تسجيل الدخول الآمن</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-color: #1a73e8; --error-color: #d93025; --success-color: #188038; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 400px; position: relative; }
        .logo { font-size: 28px; font-weight: bold; color: var(--primary-color); margin-bottom: 10px; display: block; }
        h2 { font-size: 20px; color: #3c4043; margin-bottom: 25px; }
        
        .input-group { position: relative; margin-bottom: 20px; text-align: right; }
        .input-group i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #5f6368; }
        input { width: 100%; padding: 14px 40px 14px 12px; border: 1.5px solid #dadce0; border-radius: 8px; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
        
        .toggle-password { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #5f6368; }
        
        button { background-color: var(--primary-color); color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background-color: #1557b0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        #error-message { background-color: #fce8e6; color: var(--error-color); padding: 10px; border-radius: 5px; font-size: 14px; margin-top: 15px; display: none; border: 1px solid #f5c2c7; }
        
        .footer { margin-top: 25px; font-size: 14px; color: #5f6368; border-top: 1px solid #eee; padding-top: 20px; }
        .footer a { color: var(--primary-color); text-decoration: none; font-weight: bold; }
        .footer a:hover { text-decoration: underline; }
        
        .loading-spinner { display: none; width: 20px; height: 20px; border: 3px solid #ffffff; border-top: 3px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="login-container">
    <span class="logo">SudanPay</span>
    <h2>تسجيل الدخول إلى حسابك</h2>

    <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="البريد الإلكتروني" required>
    </div>

    <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="كلمة المرور" required>
        <i class="fas fa-eye toggle-password" onclick="togglePass()"></i>
    </div>

    <button id="loginBtn" onclick="handleLogin()">
        <span id="btnText">تسجيل الدخول</span>
        <div id="spinner" class="loading-spinner"></div>
    </button>

    <div id="error-message"></div>

    <div class="footer">
        ليس لديك حساب؟ <a href="signup.html">إنشاء حساب جديد</a><br><br>
        <a href="#" onclick="forgotPassword()">نسيت كلمة المرور؟</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyB3vxJu_et-P80ek30I3MRdC_lGhooCCsc",
        authDomain: "sudanpay-e332a.firebaseapp.com",
        projectId: "sudanpay-e332a",
        storageBucket: "sudanpay-e332a.firebasestorage.app",
        messagingSenderId: "699809447272",
        appId: "1:699809447272:web:90f3780ed6c768c4322add"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // دالة إخفاء وإظهار كلمة المرور
    window.togglePass = () => {
        const passInput = document.getElementById('password');
        passInput.type = passInput.type === 'password' ? 'text' : 'password';
    };

    // دالة تسجيل الدخول
    window.handleLogin = async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-message');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const loginBtn = document.getElementById('loginBtn');

        if (!email || !pass) {
            showError("يرجى ملء جميع الحقول");
            return;
        }

        // تحويل الزر لحالة التحميل
        loginBtn.disabled = true;
        btnText.style.display = 'none';
        spinner.style.display = 'block';
        errorDiv.style.display = 'none';

        try {
            const userCred = await signInWithEmailAndPassword(auth, email, pass);
            const user = userCred.user;

            // التحقق من حالة الـ KYC في Firestore
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                const status = userSnap.data().kycStatus;

                if (status === "pending") {
                    showError("⚠️ حسابك قيد المراجعة. سيتم تفعيله خلال 24 ساعة.");
                    await auth.signOut(); // تسجيل خروج حتى يتم تفعيله
                } else if (status === "rejected") {
                    showError("❌ تم رفض طلب انضمامك. تواصل مع الدعم.");
                    await auth.signOut();
                } else {
                    // دخول ناجح
                    window.location.href = "index.html";
                }
            }
        } catch (error) {
            console.error(error);
            showError("فشل تسجيل الدخول: تأكد من صحة البيانات");
        } finally {
            loginBtn.disabled = false;
            btnText.style.display = 'block';
            spinner.style.display = 'none';
        }
    };

    // دالة استعادة كلمة المرور
    window.forgotPassword = () => {
        const email = document.getElementById('email').value;
        if (!email) {
            alert("يرجى كتابة بريدك الإلكتروني أولاً في الخانة المخصصة.");
            return;
        }
        sendPasswordResetEmail(auth, email)
            .then(() => alert("تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك."))
            .catch(err => alert("خطأ: " + err.message));
    };

    function showError(text) {
        const errorDiv = document.getElementById('error-message');
        errorDiv.innerText = text;
        errorDiv.style.display = 'block';
    }
</script>

</body>
</html>
