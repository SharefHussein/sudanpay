<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudan Pay - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0f172a] text-white p-4">
    <header class="flex flex-col items-center py-6">
        <div class="w-14 h-14 bg-[#1e293b] rounded-full flex items-center justify-center border-2 border-[#a3e635] mb-2">
            <span class="text-[#a3e635] text-2xl font-black italic">S</span>
        </div>
        <h1 class="text-lg font-bold">Sudan <span class="text-[#a3e635]">Pay</span></h1>
    </header>

    <div class="glass-card p-8 text-center mb-8 relative">
        <p class="text-[10px] text-gray-400 mb-1">Total Revenue</p>
        <h2 id="balance" class="text-3xl font-black italic">0.00 <span class="text-xs text-[#a3e635]">SDG</span></h2>
    </div>

    <div class="grid grid-cols-2 gap-4">
        <a href="send.html" class="glass-card p-6 flex flex-col items-center gap-2 transition active:scale-95">
            <div class="w-10 h-10 bg-[#a3e635] text-black rounded-lg flex items-center justify-center"><i class="fas fa-paper-plane text-sm"></i></div>
            <span class="text-[10px] font-bold">Send</span>
        </a>
        <a href="history.html" class="glass-card p-6 flex flex-col items-center gap-2 transition active:scale-95">
            <div class="w-10 h-10 bg-[#a3e635] text-black rounded-lg flex items-center justify-center"><i class="fas fa-history text-sm"></i></div>
            <span class="text-[10px] font-bold">History</span>
        </a>
        <a href="profile.html" class="glass-card p-6 flex flex-col items-center gap-2 transition active:scale-95">
            <div class="w-10 h-10 bg-[#a3e635] text-black rounded-lg flex items-center justify-center"><i class="fas fa-user text-sm"></i></div>
            <span class="text-[10px] font-bold">Profile</span>
        </a>
        <button onclick="auth.signOut()" class="glass-card p-6 flex flex-col items-center gap-2 transition active:scale-95">
            <div class="w-10 h-10 bg-red-500 text-white rounded-lg flex items-center justify-center"><i class="fas fa-sign-out-alt text-sm"></i></div>
            <span class="text-[10px] font-bold">Sign out</span>
        </button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="app.js"></script>
    <script>
        auth.onAuthStateChanged(user => {
            if(user) {
                db.collection("users").doc(user.uid).onSnapshot(doc => {
                    if(doc.exists) document.getElementById('balance').innerText = (doc.data().balance || 0).toLocaleString();
                });
            } else { window.location.href = "login.html"; }
        });
    </script>
</body>
</html>
