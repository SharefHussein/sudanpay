<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - Sudan Pay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0b0e14] p-6 text-white">
    <div class="flex justify-between items-center mb-10">
        <h2 class="text-xl font-bold italic">Sudan <span class="text-[#a3e635]">Pay</span></h2>
        <button onclick="auth.signOut().then(()=>window.location.href='login.html')" class="text-red-400 font-bold">خروج</button>
    </div>

    <div class="neon-card bg-gradient-to-br from-[#161b22] to-[#0b0e14] mb-8 text-center py-10">
        <p class="text-gray-400 text-sm mb-2">الرصيد المتاح</p>
        <h1 class="text-4xl font-black text-[#a3e635] shadow-lg">0.00 <small class="text-lg uppercase">sdg</small></h1>
    </div>

    <div class="grid grid-cols-2 gap-4">
        <a href="send.html" class="neon-card text-center flex flex-col items-center gap-2 py-8">
            <span class="text-2xl">💸</span>
            <p class="font-bold">تحويل</p>
        </a>
        <a href="history.html" class="neon-card text-center flex flex-col items-center gap-2 py-8">
            <span class="text-2xl">📋</span>
            <p class="font-bold">السجل</p>
        </a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="app.js"></script>
</body>
</html>
