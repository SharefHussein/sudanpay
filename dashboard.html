<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudan Pay - لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #94a3b8;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body { background: #f1f5f9; min-height: 100vh; padding: 20px; }

        .dashboard-container { max-width: 500px; margin: 0 auto; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* كرت الرصيد الأخضر مثل تصميمك */
        .balance-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 24px;
            padding: 30px;
            color: white;
            text-align: center;
            box-shadow: 0 15px 30px rgba(13, 148, 136, 0.2);
            position: relative;
            overflow: hidden;
        }

        .balance-label { font-size: 1rem; opacity: 0.9; margin-bottom: 10px; }
        .balance-amount { font-size: 2.5rem; font-weight: 800; margin-bottom: 5px; }
        .balance-usdt { font-size: 1.1rem; opacity: 0.8; }

        .address-box {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 15px;
            margin-top: 25px;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .address-text { font-family: monospace; word-break: break-all; font-weight: bold; color: #fff; }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .action-btn {
            background: white;
            padding: 20px;
            border-radius: 18px;
            text-align: center;
            text-decoration: none;
            color: var(--dark);
            font-weight: 700;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .action-btn i { font-size: 1.5rem; color: var(--primary); margin-bottom: 10px; display: block; }
        .action-btn:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }

        .logout-btn {
            margin-top: 40px;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--gray);
            background: transparent;
            color: var(--gray);
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <div>
            <h2 id="user-name" style="font-size: 1.2rem; color: var(--dark);">مرحباً بك</h2>
            <p style="font-size: 0.9rem; color: var(--gray);">رصيدك المحدث اليوم</p>
        </div>
        <div class="logo" style="color: var(--primary); font-size: 1.5rem;"><i class="fas fa-wallet"></i></div>
    </div>
    <div style="display: flex; align-items: center; gap: 15px;">
    <a href="notifications.html" style="position: relative; text-decoration: none;">
        <i class="fas fa-bell" style="color: var(--primary); font-size: 1.3rem;"></i>
        <span id="notificationBadge" style="display: none; position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 0.7rem; display: flex; align-items: center; justify-content: center;">0</span>
    </a>
    </div> 

    <div class="balance-card">
        <div class="balance-label">إجمالي الرصيد (SDG)</div>
        <div class="balance-amount" id="balance-sdg">0.00</div>
        <div class="balance-usdt" id="balance-usdt">USDT 0.00</div>

        <div class="address-box">
            <span><i class="fas fa-link"></i> عنوان محفظة USDT (Tron):</span>
            <div class="address-text" id="acc-address">جاري التوليد...</div>
            <button onclick="copyAddress()" style="background:none; border:none; color:white; font-size:0.8rem; cursor:pointer; text-decoration:underline;">نسخ العنوان</button>
        </div>
    </div>

    <div class="actions-grid">
    <a href="send.html" class="action-btn">
        <i class="fas fa-paper-plane"></i> 
        <span>إرسال SDG</span>
    </a>
    <a href="send-usdt.html" class="action-btn">
        <i class="fab fa-bitcoin"></i>
        <span>إرسال USDT</span>
    </a>
    <a href="convert.html" class="action-btn">
        <i class="fas fa-exchange-alt"></i>
        <span>تحويل USDT</span>
    </a>
    <a href="withdraw.html" class="action-btn">
        <i class="fas fa-hand-holding-usd"></i>
        <span>سحب أموال</span>
    </a>
    <a href="receive.html" class="action-btn">
        <i class="fas fa-qrcode"></i>
        <span>استلام</span>
    </a>
    <a href="transactions.html" class="action-btn">
        <i class="fas fa-history"></i>
        <span>السجل</span>
    </a>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB3vxJu_et-P80ek30I3MRdC_lGhooCCsc",
        authDomain: "sudanpay-e332a.firebaseapp.com",
        projectId: "sudanpay-e332a",
        storageBucket: "sudanpay-e332a.firebasestorage.app",
        messagingSenderId: "699809447272",
        appId: "1:699809447272:web:90f3780ed6c768c4322add"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ==========================================
    // ضع مفتاح Tatum API Key الخاص بك هنا 👇
    // ==========================================
    const TATUM_API_KEY = "t-695a0ea026858bd739f1595e-363e1ef7ec404868aebf73ed"; 

    // دالة توليد محفظة USDT (Tron) وحفظها
    async function generateAndSaveWallet(uid) {
        try {
            // 1. توليد المحفظة
            const walletRes = await fetch('https://api.tatum.io/v3/tron/wallet', {
                headers: { 'x-api-key': TATUM_API_KEY }
            });
            const wallet = await walletRes.json();

            // 2. توليد العنوان من الـ xpub
            const addressRes = await fetch(`https://api.tatum.io/v3/tron/address/${wallet.xpub}/0`, {
                headers: { 'x-api-key': TATUM_API_KEY }
            });
            const addressData = await addressRes.json();

            // 3. حفظ العنوان في Firestore
            await updateDoc(doc(db, "users", uid), {
                usdtAddress: addressData.address
            });

            return addressData.address;
        } catch (error) {
            console.error("فشل توليد المحفظة:", error);
            return "حدث خطأ في التوليد";
        }
    }

    // مراقبة حالة المستخدم وتحديث البيانات
    onAuthStateChanged(auth, (user) => {
        if (user) {
            const userRef = doc(db, "users", user.uid);
            
            // تحديث لحظي للبيانات
            onSnapshot(userRef, async (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    
                    // تحديث الرصيد
                    const sdg = data.balanceSDG || 0;
                    document.getElementById('balance-sdg').innerText = sdg.toLocaleString();
                    document.getElementById('balance-usdt').innerText = "USDT " + (sdg / 2600).toFixed(2);
                    
                    // تحديث العنوان أو توليده إذا كان N/A
                    if (!data.usdtAddress) {
                        document.getElementById('acc-address').innerText = "جاري إنشاء محفظة فريدة...";
                        const newAddress = await generateAndSaveWallet(user.uid);
                        document.getElementById('acc-address').innerText = newAddress;
                    } else {
                        document.getElementById('acc-address').innerText = data.usdtAddress;
                    }
                }
            });
        } else {
            window.location.href = "index.html"; // العودة لصفحة الدخول
        }
    });

    // دالة النسخ
    window.copyAddress = () => {
        const addr = document.getElementById('acc-address').innerText;
        navigator.clipboard.writeText(addr);
        alert("تم نسخ العنوان بنجاح");
    };

    // تسجيل الخروج
    window.handleLogout = () => {
        signOut(auth).then(() => window.location.href = "index.html");
    };
</script>
</body>
</html>
