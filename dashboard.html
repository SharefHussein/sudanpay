<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudan Pay - محفظتي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="balance-card">
      <p class="text-xl">رصيدك الحالي</p>
      <h1 id="balanceSDG">جاري التحميل...</h1>
      <p class="text-xl" id="balanceUSDT">0.00 USDT</p>
    </div>

    <div class="grid-services">
      <div class="service-item">
        <div class="service-icon"><i class="fas fa-paper-plane"></i></div>
        <p>إرسال</p>
      </div>
      <div class="service-item">
        <div class="service-icon"><i class="fas fa-qrcode"></i></div>
        <p>استلام</p>
      </div>
      <div class="service-item">
        <div class="service-icon"><i class="fas fa-file-invoice"></i></div>
        <p>فواتير</p>
      </div>
      <div class="service-item">
        <div class="service-icon"><i class="fas fa-mobile-alt"></i></div>
        <p>شحن هاتف</p>
      </div>
      <div class="service-item">
        <div class="service-icon"><i class="fas fa-exchange-alt"></i></div>
        <p>تحويل بنكي</p>
      </div>
      <div class="service-item">
        <div class="service-icon"><i class="fas fa-history"></i></div>
        <p>السجل</p>
      </div>
      <div class="service-item">
        <div class="service-icon"><i class="fas fa-cog"></i></div>
        <p>الإعدادات</p>
      </div>
      <div class="service-item">
        <div class="service-icon"><i class="fas fa-headset"></i></div>
        <p>الدعم</p>
      </div>
    </div>

    <button onclick="logout()" class="btn-main">تسجيل الخروج</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
