<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>الدخول المباشر - Sudan Pay</title>
</head>
<body style="text-align: center; padding: 50px; font-family: Arial;">
    <h1>🚀 الدخول المباشر إلى Sudan Pay</h1>
    
    <div style="margin: 30px;">
        <button onclick="goToDashboard()" 
                style="padding: 15px 30px; background: #10b981; color: white; border: none; border-radius: 10px; font-size: 18px;">
            🔓 الدخول المباشر إلى لوحة التحكم
        </button>
    </div>
    
    <div style="margin: 30px;">
        <button onclick="testFirebase()" 
                style="padding: 15px 30px; background: #4285f4; color: white; border: none; border-radius: 10px; font-size: 18px;">
            🔧 اختبار Firebase
        </button>
    </div>
    
    <div id="result" style="margin-top: 30px; padding: 20px; background: #f5f5f5; border-radius: 10px;"></div>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB3vxJu_et-P80ek30I3MRdC_lGhooCCsc",
            authDomain: "sudanpay-e332a.firebaseapp.com",
            projectId: "sudanpay-e332a",
            storageBucket: "sudanpay-e332a.appspot.com",
            messagingSenderId: "699809447272",
            appId: "1:699809447272:web:90f3780ed6c768c4322add"
        };
        
        firebase.initializeApp(firebaseConfig);
        
        function goToDashboard() {
            document.getElementById("result").innerHTML = "<p>جاري التوجيه...</p>";
            window.location.href = "dashboard.html";
        }
        
        function testFirebase() {
            const user = firebase.auth().currentUser;
            document.getElementById("result").innerHTML = `
                <h3>نتائج الاختبار:</h3>
                <p><strong>Firebase:</strong> ${typeof firebase !== 'undefined' ? '✅ يعمل' : '❌ لا يعمل'}</p>
                <p><strong>المستخدم:</strong> ${user ? user.email : '❌ غير مسجل'}</p>
                <p><strong>الصفحة الحالية:</strong> ${window.location.href}</p>
            `;
        }
    </script>
</body>
</html>
