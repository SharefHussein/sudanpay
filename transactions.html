<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudan Pay - سجل العمليات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .filter-section { background: white; border-radius: 20px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { padding: 15px; border-radius: 15px; text-align: center; }
        .stat-card.sent { background: #fef2f2; border: 1px solid #fee2e2; }
        .stat-card.received { background: #f0fdf4; border: 1px solid #dcfce7; }
        
        .transaction-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.2s;
        }
        .transaction-item:hover { background: #f8fafc; }
        .transaction-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 15px;
        }
        .icon-send { background: #fee2e2; color: #ef4444; }
        .icon-receive { background: #dcfce7; color: #22c55e; }
        
        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; padding: 20px; }
        .page-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--primary); background: white; color: var(--primary); cursor: pointer; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <a href="dashboard.html" class="navbar-brand">
                <i class="fas fa-arrow-right"></i> العودة
            </a>
            <div class="navbar-menu">
                <span class="text-primary font-bold">سجل العمليات</span>
            </div>
        </nav>

        <div class="stats-grid">
            <div class="stat-card sent">
                <div class="text-gray mb-1" style="font-size: 0.8rem;">إجمالي المرسل</div>
                <div class="text-xl font-bold text-danger" id="totalSent">0.00 SDG</div>
            </div>
            <div class="stat-card received">
                <div class="text-gray mb-1" style="font-size: 0.8rem;">إجمالي المستلم</div>
                <div class="text-xl font-bold text-success" id="totalReceived">0.00 SDG</div>
            </div>
        </div>

        <div class="filter-section">
            <div style="display: flex; gap: 10px;">
                <select class="form-control" id="filterType" onchange="filterTransactions()" style="flex: 1;">
                    <option value="all">كل العمليات</option>
                    <option value="send">المرسلة فقط</option>
                    <option value="receive">المستلمة فقط</option>
                </select>
                <button class="btn btn-outline" onclick="exportToCSV()" style="padding: 10px;">
                    <i class="fas fa-file-export"></i>
                </button>
            </div>
        </div>

        <div class="card" style="padding: 0;">
            <div id="transactionsContainer">
                <div class="text-center p-5 text-gray">جاري التحميل...</div>
            </div>
            
            <div class="pagination" id="paginationControls" style="display: none;">
                <button class="page-btn" id="prevBtn" onclick="changePage(-1)">السابق</button>
                <span id="pageNumber" class="font-bold">1</span>
                <button class="page-btn" id="nextBtn" onclick="changePage(1)">التالي</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, getUserData, showAlert } from './app.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        let allTransactions = [];
        let filteredData = [];
        let currentPage = 1;
        const limit = 10;

        async function loadTransactions() {
            const user = auth.currentUser;
            if (!user) return;

            const data = await getUserData(user.uid);
            if (data && data.transactions) {
                allTransactions = data.transactions.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                calculateStats();
                filterTransactions();
            } else {
                document.getElementById('transactionsContainer').innerHTML = `
                    <div class="text-center p-5 text-gray">لا توجد عمليات مسجلة</div>
                `;
            }
        }

        function calculateStats() {
            let sent = 0, received = 0;
            allTransactions.forEach(t => {
                if (t.type === 'send') sent += t.amount;
                else if (t.type === 'receive') received += t.amount;
            });
            document.getElementById('totalSent').textContent = sent.toLocaleString() + " SDG";
            document.getElementById('totalReceived').textContent = received.toLocaleString() + " SDG";
        }

        window.filterTransactions = () => {
            const type = document.getElementById('filterType').value;
            filteredData = type === 'all' ? allTransactions : allTransactions.filter(t => t.type === type);
            currentPage = 1;
            renderList();
        };

        function renderList() {
            const container = document.getElementById('transactionsContainer');
            const start = (currentPage - 1) * limit;
            const end = start + limit;
            const pageItems = filteredData.slice(start, end);

            if (pageItems.length === 0) {
                container.innerHTML = '<div class="text-center p-5 text-gray">لا توجد نتائج</div>';
                document.getElementById('paginationControls').style.display = 'none';
                return;
            }

            container.innerHTML = pageItems.map(t => `
                <div class="transaction-item">
                    <div class="transaction-icon ${t.type === 'send' ? 'icon-send' : 'icon-receive'}">
                        <i class="fas ${t.type === 'send' ? 'fa-arrow-up' : 'fa-arrow-down'}"></i>
                    </div>
                    <div style="flex: 1;">
                        <div style="font-weight: 700; font-size: 0.95rem;">${t.description}</div>
                        <div style="font-size: 0.75rem; color: #94a3b8;">${new Date(t.timestamp).toLocaleString('ar-EG')}</div>
                    </div>
                    <div style="text-align: left;">
                        <div style="font-weight: 800; color: ${t.type === 'send' ? '#ef4444' : '#22c55e'};">
                            ${t.type === 'send' ? '-' : '+'}${t.amount.toFixed(2)}
                        </div>
                        <div style="font-size: 0.7rem; color: #94a3b8;">SDG</div>
                    </div>
                </div>
            `).join('');

            updatePagination();
        }

        function updatePagination() {
            const controls = document.getElementById('paginationControls');
            controls.style.display = filteredData.length > limit ? 'flex' : 'none';
            document.getElementById('pageNumber').textContent = currentPage;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage * limit >= filteredData.length;
        }

        window.changePage = (dir) => {
            currentPage += dir;
            renderList();
            window.scrollTo(0, 0);
        };

        window.exportToCSV = () => {
            if (filteredData.length === 0) return showAlert('لا توجد بيانات لتصديرها', 'error');
            
            let csv = 'التاريخ,الوصف,النوع,المبلغ\n';
            filteredData.forEach(t => {
                csv += `${new Date(t.timestamp).toLocaleDateString('ar-EG')},${t.description},${t.type === 'send' ? 'إرسال' : 'استلام'},${t.amount}\n`;
            });

            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `SudanPay_Report_${new Date().toLocaleDateString()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        onAuthStateChanged(auth, (user) => {
            if (user) loadTransactions();
            else window.location.href = 'index.html';
        });
    </script>
</body>
</html>
