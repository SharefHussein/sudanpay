<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudan Pay - الملف الشخصي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">
  <div class="container">
    <h2 class="text-3xl font-bold text-center mb-10">الملف الشخصي</h2>

    <div class="card text-center">
      <div class="w-32 h-32 bg-teal-600 rounded-full mx-auto mb-6 flex items-center justify-center text-5xl text-white">
        <i class="fas fa-user"></i>
      </div>
      <h3 id="userName" class="text-2xl font-bold mb-4">جاري التحميل...</h3>
      <p id="userEmail" class="text-lg text-gray-600 mb-6">جاري التحميل...</p>
      <p class="text-lg">رقم الحساب: <strong id="accountID">جاري التحميل...</strong></p>
    </div>

    <div class="grid grid-cols-1 gap-6 mt-10">
      <a href="settings.html" class="btn-main text-center py-5 text-xl">الإعدادات</a>
      <a href="support.html" class="btn-sub text-center py-5 text-xl">التواصل مع الدعم</a>
      <button onclick="logout()" class="btn-logout py-5 text-xl">تسجيل الخروج</button>
    </div>
  </div>

  <script type="module" src="profile-logic.js"></script>
</body>
</html>
