<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudan Pay - الملف الشخصي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-header {
            text-align: center;
            padding: 30px 20px;
            background: white;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: 700;
        }
        .profile-name { font-size: 1.4rem; font-weight: 700; color: var(--dark); margin-bottom: 5px; }
        .profile-email { color: var(--gray); font-size: 0.9rem; }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        .info-item:last-child { border-bottom: none; }
        .info-label { color: var(--gray); display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        .info-value { font-weight: 600; color: var(--dark); }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        
        /* Switch Styling */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        .dark-mode-active { background: #0f172a !important; color: white !important; }
        .dark-mode-active .card, .dark-mode-active .profile-header { background: #1e293b; color: white; }
        .dark-mode-active .info-value { color: white; }
        .dark-mode-active .profile-name { color: white; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <a href="dashboard.html" class="navbar-brand">
                <i class="fas fa-arrow-right"></i> العودة
            </a>
            <div class="navbar-menu">
                <span class="text-primary font-bold">الملف الشخصي</span>
            </div>
        </nav>

        <div class="profile-header">
            <div class="avatar" id="userAvatar">?</div>
            <h2 class="profile-name" id="userName">...</h2>
            <p class="profile-email" id="userEmail">...</p>
        </div>

        <div class="card">
            <div class="card-header">
                <h3 class="card-title"><i class="fas fa-info-circle"></i> معلومات الحساب</h3>
            </div>
            <div class="profile-info">
                <div class="info-item">
                    <div class="info-label"><i class="fas fa-id-card"></i> رقم الحساب</div>
                    <div class="info-value" id="accountID">...</div>
                </div>
                <div class="info-item">
                    <div class="info-label"><i class="fas fa-calendar"></i> تاريخ الإنضمام</div>
                    <div class="info-value" id="createdAt">...</div>
                </div>
                <div class="info-item">
                    <div class="info-label"><i class="fas fa-shield-alt"></i> حالة الحساب</div>
                    <div class="info-value"><span class="text-success">نشط</span></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3 class="card-title"><i class="fas fa-cog"></i> الإعدادات والأمان</h3>
            </div>
            <div class="profile-info">
                <div class="info-item" onclick="changePassword()" style="cursor: pointer;">
                    <div class="info-label"><i class="fas fa-key"></i> تغيير كلمة المرور</div>
                    <div class="info-value"><i class="fas fa-chevron-left"></i></div>
                </div>
                <div class="info-item">
                    <div class="info-label"><i class="fas fa-moon"></i> الوضع الليلي</div>
                    <div class="info-value">
                        <label class="switch">
                            <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="window.location.href='support.html'">
                <i class="fas fa-headset"></i> الدعم الفني
            </button>
            <button class="btn btn-danger" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
            </button>
        </div>
    </div>

    <script type="module">
        import { auth, db, logoutUser, getUserData, showAlert } from './app.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // تحميل البيانات
        async function loadProfile() {
            const user = auth.currentUser;
            if (!user) return;

            try {
                const data = await getUserData(user.uid);
                if (data) {
                    document.getElementById('userName').textContent = data.name || "مستخدم جديد";
                    document.getElementById('userEmail').textContent = user.email;
                    document.getElementById('accountID').textContent = data.accountID || "N/A";
                    
                    // الأيقونة
                    document.getElementById('userAvatar').textContent = data.name ? data.name.charAt(0).toUpperCase() : "?";

                    // تاريخ الإنشاء
                    if (data.createdAt) {
                        const date = new Date(data.createdAt);
                        document.getElementById('createdAt').textContent = date.toLocaleDateString('ar-EG');
                    }
                }
            } catch (error) {
                console.error(error);
                showAlert('خطأ في تحميل البيانات');
            }
        }

        // تسجيل الخروج
        window.handleLogout = async () => {
            if(confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                await logoutUser();
                window.location.href = 'index.html';
            }
        };

        // الوضع الليلي البسيط
        window.toggleDarkMode = () => {
            const isDark = document.getElementById('darkModeToggle').checked;
            if (isDark) {
                document.body.classList.add('dark-mode-active');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark-mode-active');
                localStorage.setItem('theme', 'light');
            }
        };

        // تغيير كلمة المرور
        window.changePassword = () => {
            showAlert('سيتم إرسال رابط تعيين كلمة المرور لبريدك قريباً', 'info');
        };

        // فحص حالة الدخول
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadProfile();
                // استرجاع الوضع الليلي المفضل
                if (localStorage.getItem('theme') === 'dark') {
                    document.getElementById('darkModeToggle').checked = true;
                    toggleDarkMode();
                }
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
