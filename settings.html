<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudan Pay - الإعدادات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">
  <div class="container">
    <h2 class="text-3xl font-bold text-center mb-10">الإعدادات</h2>

    <div class="card space-y-8">
      <div class="flex justify-between items-center">
        <p class="text-lg">إشعارات التحويلات</p>
        <label class="switch">
          <input type="checkbox" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="flex justify-between items-center">
        <p class="text-lg">الوضع الليلي</p>
        <label class="switch">
          <input type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
      <div class="flex justify-between items-center">
        <p class="text-lg">تغيير كلمة المرور</p>
        <i class="fas fa-chevron-left text-teal-600 text-2xl"></i>
      </div>
      <div class="flex justify-between items-center">
        <p class="text-lg">تفعيل البصمة</p>
        <label class="switch">
          <input type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <a href="dashboard.html" class="block text-center text-teal-600 mt-8 text-lg">العودة للمحفظة</a>
  </div>
</body>
</html>
