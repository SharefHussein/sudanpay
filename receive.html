<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استلام - Sudan Pay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>body { background: #0f172a; font-family: 'Cairo', sans-serif; color: white; } .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }</style>
</head>
<body class="p-6 pb-24 text-center">
    <header class="mb-10 flex items-center gap-4">
        <a href="dashboard.html" class="w-10 h-10 glass rounded-full flex items-center justify-center text-gray-500"><i class="fas fa-arrow-right"></i></a>
        <h1 class="text-xl font-bold">طلب أموال</h1>
    </header>

    <div class="glass p-10 rounded-[40px] inline-block w-full max-w-sm">
        <div id="qrcode" class="bg-white p-4 rounded-3xl inline-block mb-6 shadow-2xl"></div>
        <h2 id="userName" class="text-lg font-bold mb-1">...</h2>
        <p id="userEmail" class="text-gray-500 text-xs mb-6">...</p>
        <button onclick="copyEmail()" class="glass px-6 py-2 rounded-full text-xs text-[#a3e635] border-[#a3e635]/20">نسخ البريد</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="app.js"></script>
    <script>
        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('userEmail').innerText = user.email;
                new QRCode(document.getElementById("qrcode"), { text: user.email, width: 200, height: 200, colorDark : "#000", colorLight : "#ffffff" });
                db.collection("users").doc(user.uid).get().then(doc => { if(doc.exists) document.getElementById('userName').innerText = doc.data().name; });
            }
        });
        function copyEmail() { navigator.clipboard.writeText(document.getElementById('userEmail').innerText); showNotify("تم نسخ البريد"); }
    </script>
</body>
</html>
