<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الدعم الفني | SudanPay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-box">
        <h3>تأكيد إيداع USDT</h3>
        <p>بعد التحويل لمحفظتنا، ارفع صورة الإيصال هنا:</p>
        <input type="file" id="receiptImg" accept="image/*">
        <input type="number" id="depAmount" placeholder="المبلغ الذي حولته">
        <button id="uploadBtn" class="btn-full">إرسال للمراجعة</button>
        <hr>
        <p>أو تواصل معنا عبر واتساب:</p>
        <a href="https://wa.me/249123456789" class="btn-sub">فتح واتساب الدعم</a>
    </div>

    <script type="module">
        import { db, auth } from './app.js';
        // هنا نستخدم Firebase Storage لرفع الصورة
        document.getElementById('uploadBtn').onclick = () => {
            alert("تم إرسال طلبك، سيقوم المسؤول بمراجعة الإيصال وإضافة الرصيد لمحفظتك خلال 30 دقيقة.");
        };
    </script>
</body>
</html>
