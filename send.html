<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال - Sudan Pay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-6">
    <header class="flex items-center gap-4 mb-10">
        <a href="dashboard.html" class="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center border border-white/10 text-[#a3e635]">
            <i class="fas fa-arrow-right"></i>
        </a>
        <h1 class="text-xl font-bold">إرسال أموال</h1>
    </header>

    <div class="neon-card">
        <div class="mb-6">
            <label class="text-[10px] text-gray-500 uppercase tracking-widest mb-2 block mr-2">بريد المستلم</label>
            <input type="email" id="toEmail" placeholder="name@example.com" 
                   class="w-full p-4 rounded-xl bg-white/5 border border-white/10 text-white outline-none focus:border-[#a3e635] transition">
        </div>

        <div class="mb-10 text-center">
            <label class="text-[10px] text-gray-500 uppercase tracking-widest mb-2 block">المبلغ المراد تحويله</label>
            <input type="number" id="amount" placeholder="0.00" 
                   class="w-full bg-transparent text-5xl font-black text-[#a3e635] text-center outline-none border-b border-white/5 pb-4">
        </div>

        <button onclick="sendMoney()" class="w-full py-5 btn-neon shadow-lg shadow-lime-500/20 active:scale-95 transition">
            تأكيد التحويل الآن
        </button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="app.js"></script>
</body>
</html>
