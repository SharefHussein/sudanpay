<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العمليات - Sudan Pay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-6">
    <header class="flex items-center gap-4 mb-8">
        <a href="dashboard.html" class="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center border border-white/10 text-[#a3e635]">
            <i class="fas fa-arrow-right"></i>
        </a>
        <h1 class="text-xl font-bold">آخر العمليات</h1>
    </header>

    <div id="txList" class="space-y-4">
        <div class="text-center py-20">
            <i class="fas fa-spinner animate-spin text-[#a3e635] text-2xl"></i>
            <p class="text-gray-500 text-xs mt-4">جاري مزامنة بياناتك...</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="app.js"></script>
    <script>
        auth.onAuthStateChanged(user => {
            if(user) loadTransactions(user.email);
            else window.location.href = "login.html";
        });
    </script>
</body>
</html>
