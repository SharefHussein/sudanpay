<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudan Pay - تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-container {
      background: white;
      width: 90%;
      max-width: 400px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 40px 30px;
      text-align: center;
    }
    .logo {
      width: 120px;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 28px;
      color: #2c3e50;
      margin-bottom: 10px;
    }
    p {
      color: #7f8c8d;
      margin-bottom: 30px;
      font-size: 16px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }
    input:focus {
      border-color: #0d9488;
      outline: none;
    }
    .btn-primary {
      background: #0d9488;
      color: white;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      width: 100%;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .btn-google {
      background: #ffffff;
      color: #333;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .link {
      color: #0d9488;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="logo.png" alt="Sudan Pay" class="logo">
    <h1>مرحباً بك في Sudan Pay</h1>
    <p>سجل دخولك للوصول إلى محفظتك</p>

    <div class="input-group">
      <input type="email" id="email" placeholder="البريد الإلكتروني أو رقم الهاتف">
    </div>
    <div class="input-group">
      <input type="password" id="password" placeholder="كلمة المرور">
    </div>

    <button id="login-btn" class="btn-primary">تسجيل الدخول</button>

    <button id="google-btn" class="btn-google">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
      الدخول بجوجل
    </button>

    <p class="mt-20">
      ليس لديك حساب؟ <a href="#" id="signup-link" class="link">إنشاء حساب جديد</a>
    </p>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
