<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudan Pay - تسجيل الدخول الآمن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --secondary: #0891b2;
            --accent: #10b981;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --light: #f8fafc;
            --gray: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            padding: 50px 40px;
            text-align: center;
        }

        .logo { font-size: 4rem; color: var(--primary); margin-bottom: 25px; }

        h1 { font-size: 2rem; color: var(--dark); margin-bottom: 10px; font-weight: 800; }

        .subtitle { color: var(--gray); margin-bottom: 40px; font-size: 1.1rem; line-height: 1.6; }

        .input-group { margin-bottom: 25px; position: relative; }

        .input-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 1.2rem;
        }

        input {
            width: 100%;
            padding: 18px 60px 18px 20px;
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 1.1rem;
            transition: all 0.3s;
            background: #f8fafc;
            text-align: right;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.1);
        }

        .password-toggle {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
        }

        .btn-primary {
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin: 10px 0 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 20px rgba(13, 148, 136, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(13, 148, 136, 0.4);
        }

        .divider { display: flex; align-items: center; margin: 30px 0; color: var(--gray); font-size: 0.95rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
        .divider span { padding: 0 20px; }

        .auth-footer {
            text-align: center;
            color: var(--gray);
            font-size: 1rem;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 700; }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #alert-box {
            display: none;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .alert-warning { background: #ffedd5; color: #9a3412; border: 1px solid #fed7aa; }

    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo"><i class="fas fa-wallet"></i></div>
        
        <h1>Sudan Pay</h1>
        <p class="subtitle">سجل دخولك للوصول إلى محفظتك الرقمية الآمنة</p>

        <div id="alert-box"></div>
        
        <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" placeholder="البريد الإلكتروني" required>
        </div>
        
        <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <button type="button" class="password-toggle" onclick="togglePassword()">
                <i class="fas fa-eye" id="eye-icon"></i>
            </button>
            <input type="password" id="password" placeholder="كلمة المرور" required>
        </div>
        
        <button id="login-btn" class="btn-primary">
            <i class="fas fa-sign-in-alt"></i> <span>تسجيل الدخول</span>
        </button>
        
        <div class="divider"><span>أو</span></div>
        
        <button id="google-btn" class="btn-primary" style="background: white; color: var(--dark); border: 2px solid var(--border); box-shadow: none;">
            <i class="fab fa-google" style="color: #4285F4;"></i> الدخول بجوجل
        </button>
        
        <div class="auth-footer">
            <p>ليس لديك حساب؟ <a href="signup.html">إنشاء حساب جديد</a></p>
            <p style="margin-top: 10px;"><a href="#" onclick="resetPassword()" style="font-size: 0.9rem; color: var(--gray);">نسيت كلمة المرور؟</a></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB3vxJu_et-P80ek30I3MRdC_lGhooCCsc",
            authDomain: "sudanpay-e332a.firebaseapp.com",
            projectId: "sudanpay-e332a",
            storageBucket: "sudanpay-e332a.firebasestorage.app",
            messagingSenderId: "699809447272",
            appId: "1:699809447272:web:90f3780ed6c768c4322add"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // تنبيهات مخصصة
        function showAlert(msg, type = 'error') {
            const box = document.getElementById('alert-box');
            box.innerText = msg;
            box.className = type === 'error' ? 'alert-error' : (type === 'success' ? 'alert-success' : 'alert-warning');
            box.style.display = 'block';
            if(type === 'success') setTimeout(() => box.style.display = 'none', 3000);
        }

        // إظهار وإخفاء كلمة المرور
        window.togglePassword = () => {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                passInput.type = 'password';
                icon.className = 'fas fa-eye';
            }
        };

        // دالة تسجيل الدخول والتحقق من KYC
        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');

            if (!email || !pass) { showAlert('يرجى ملء جميع الحقول'); return; }

            try {
                btn.disabled = true;
                btn.innerHTML = '<div class="loading"></div> جاري التحقق...';
                
                const userCred = await signInWithEmailAndPassword(auth, email, pass);
                const uid = userCred.user.uid;

                // فحص حالة الحساب في Firestore
                const userDoc = await getDoc(doc(db, "users", uid));
                
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    const status = userData.kycStatus;

                    if (status === "pending") {
                        showAlert('⚠️ حسابك قيد المراجعة حالياً. سيتم تفعيله خلال 24 ساعة.', 'warning');
                        await signOut(auth); // طرده من الجلسة حتى يتم التفعيل
                    } else if (status === "rejected") {
                        showAlert('❌ تم رفض طلب انضمامك. يرجى مراجعة الدعم الفني.', 'error');
                        await signOut(auth);
                    } else {
                        showAlert('تم تسجيل الدخول بنجاح!', 'success');
                        setTimeout(() => window.location.href = "dashboard.html", 1000);
                    }
                } else {
                    showAlert('لم يتم العثور على بيانات الحساب.');
                }
            } catch (error) {
                console.error(error);
                showAlert('خطأ: تأكد من صحة البريد الإلكتروني وكلمة المرور');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
            }
        }

        // استعادة كلمة المرور
        window.resetPassword = () => {
            const email = document.getElementById('email').value;
            if(!email) { showAlert('أدخل بريدك أولاً لإرسال رابط الاستعادة'); return; }
            sendPasswordResetEmail(auth, email)
                .then(() => showAlert('تم إرسال رابط الاستعادة لبريدك', 'success'))
                .catch(err => showAlert('خطأ في إرسال الرابط'));
        };

        document.getElementById('login-btn').addEventListener('click', handleLogin);
    </script>
</body>
</html>
