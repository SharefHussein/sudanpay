<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudan Pay - تسجيل الدخول الآمن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --secondary: #0891b2;
            --accent: #10b981;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --light: #f8fafc;
            --gray: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #e2e8f0;
            --border-radius: 14px;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Cairo', sans-serif; 
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s ease;
            overflow-x: hidden;
        }

        /* خلفية متحركة متطورة */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .gradient-bg {
            background: linear-gradient(-45deg, 
                #667eea, #764ba2, #0d9488, #0891b2);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* تأثيرات floating */
        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* تأثيرات دخول */
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body.dark-mode {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: var(--border-radius);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            padding: 50px 40px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease-out;
        }

        .dark-mode .login-container {
            background: #1e293b;
            color: #f1f5f9;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .logo { 
            font-size: 4rem; 
            color: var(--primary); 
            margin-bottom: 25px; 
            animation: floating 3s ease-in-out infinite;
        }

        h1 { 
            font-size: 2rem; 
            color: var(--dark); 
            margin-bottom: 10px; 
            font-weight: 800; 
        }

        .dark-mode h1 {
            color: #f1f5f9;
        }

        .subtitle { 
            color: var(--gray); 
            margin-bottom: 40px; 
            font-size: 1.1rem; 
            line-height: 1.6; 
        }

        .dark-mode .subtitle {
            color: #cbd5e1;
        }

        /* شريط التقدم */
        .progress-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 30px;
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            position: relative;
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            top: 25px;
            left: 10%;
            right: 10%;
            height: 3px;
            background: var(--border);
            z-index: 1;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 25px;
            left: 10%;
            width: 33%;
            height: 3px;
            background: var(--primary);
            z-index: 2;
            transition: width 0.5s ease;
        }

        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
            position: relative;
        }

        .step-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--border);
            color: var(--gray);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }

        .progress-step.active .step-number {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 0 5px rgba(13, 148, 136, 0.2);
        }

        .step-label {
            font-size: 0.8rem;
            color: var(--gray);
            font-weight: 600;
        }

        .progress-step.active .step-label {
            color: var(--primary);
        }

        /* Alert System */
        #alert-box {
            position: relative;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            display: none;
            animation: slideDown 0.3s ease;
            text-align: right;
        }

        .alert-error { 
            background: #fee2e2; 
            color: #b91c1c; 
            border: 1px solid #fecaca; 
        }

        .alert-success { 
            background: #d1fae5; 
            color: #065f46; 
            border: 1px solid #a7f3d0; 
        }

        .alert-warning { 
            background: #ffedd5; 
            color: #9a3412; 
            border: 1px solid #fed7aa; 
        }

        .alert-info { 
            background: #dbeafe; 
            color: #1e40af; 
            border: 1px solid #bfdbfe; 
        }

        .dark-mode .alert-error { 
            background: #7f1d1d; 
            color: #fecaca; 
            border-color: #991b1b; 
        }

        .dark-mode .alert-success { 
            background: #065f46; 
            color: #a7f3d0; 
            border-color: #047857; 
        }

        .dark-mode .alert-warning { 
            background: #92400e; 
            color: #fed7aa; 
            border-color: #b45309; 
        }

        .dark-mode .alert-info { 
            background: #1e40af; 
            color: #bfdbfe; 
            border-color: #1d4ed8; 
        }

        .alert-close {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 1.2rem;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .alert-close:hover {
            opacity: 1;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Input Groups */
        .input-group { 
            margin-bottom: 25px; 
            position: relative;
            perspective: 1000px;
        }

        .input-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 1.2rem;
            z-index: 2;
            transition: color 0.3s;
        }

        input {
            width: 100%;
            padding: 18px 60px 18px 20px;
            border: 2px solid var(--border);
            border-radius: var(--border-radius);
            font-size: 1.1rem;
            transition: all 0.3s;
            background: #f8fafc;
            text-align: right;
            direction: ltr;
            position: relative;
        }

        .dark-mode input {
            background: #334155;
            border-color: #475569;
            color: #f1f5f9;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.1);
        }

        .dark-mode input:focus {
            background: #475569;
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.2);
        }

        /* تأثير focus للـ input */
        .input-focus-effect {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.4s ease;
            border-radius: 0 0 var(--border-radius) var(--border-radius);
        }

        input:focus ~ .input-focus-effect {
            width: 100%;
        }

        /* تأثير اهتزاز للخطأ */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translateX(-1px); }
            20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-3px); }
            40%, 60% { transform: translateX(3px); }
        }

        .password-toggle {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
            z-index: 2;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 18px;
            border-radius: var(--border-radius);
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin: 10px 0 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 20px rgba(13, 148, 136, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* تأثير ripple للأزرار */
        .ripple {
            position: relative;
            overflow: hidden;
        }

        .ripple:after {
            content: "";
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #fff 10%, transparent 10.01%);
            background-repeat: no-repeat;
            background-position: 50%;
            transform: scale(10, 10);
            opacity: 0;
            transition: transform .5s, opacity 1s;
        }

        .ripple:active:after {
            transform: scale(0, 0);
            opacity: .3;
            transition: 0s;
        }

        /* تأثير pulse */
        .pulse-effect {
            position: relative;
            overflow: hidden;
        }

        .pulse-effect:after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }

        .pulse-effect:focus:not(:active)::after {
            animation: ripple 1s ease-out;
        }

        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }
            100% {
                transform: scale(50, 50);
                opacity: 0;
            }
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(13, 148, 136, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-google {
            background: white;
            color: var(--dark);
            border: 2px solid var(--border);
            box-shadow: none;
        }

        .btn-google:hover:not(:disabled) {
            background: #f8fafc;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .dark-mode .btn-google {
            background: #334155;
            color: #f1f5f9;
            border-color: #475569;
        }

        /* Quick Login Buttons */
        .quick-login-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .quick-login-btn {
            background: transparent;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--dark);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .quick-login-btn i {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .quick-login-btn:hover {
            background: rgba(13, 148, 136, 0.05);
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .dark-mode .quick-login-btn {
            color: #f1f5f9;
            border-color: #475569;
        }

        .dark-mode .quick-login-btn:hover {
            background: rgba(13, 148, 136, 0.1);
        }

        .divider { 
            display: flex; 
            align-items: center; 
            margin: 30px 0; 
            color: var(--gray); 
            font-size: 0.95rem; 
        }
        .divider::before, .divider::after { 
            content: ''; 
            flex: 1; 
            border-bottom: 1px solid var(--border); 
        }
        .divider span { 
            padding: 0 20px; 
            background: white; 
        }

        .dark-mode .divider span {
            background: #1e293b;
        }

        .dark-mode .divider::before,
        .dark-mode .divider::after {
            border-bottom-color: #475569;
        }

        .auth-footer {
            text-align: center;
            color: var(--gray);
            font-size: 1rem;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .dark-mode .auth-footer {
            border-top-color: #475569;
        }

        .auth-footer a { 
            color: var(--primary); 
            text-decoration: none; 
            font-weight: 700; 
            transition: color 0.3s;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin { 
            to { 
                transform: rotate(360deg); 
            } 
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--dark);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .dark-mode .theme-toggle {
            background: rgba(30, 41, 59, 0.9);
            color: #f1f5f9;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
        }

        /* Notification Bell */
        .notification-bell {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--dark);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .notification-bell:hover {
            transform: scale(1.1) rotate(-15deg);
            color: var(--primary);
        }

        .notification-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--danger);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .dark-mode .notification-bell {
            background: rgba(30, 41, 59, 0.9);
            color: #f1f5f9;
        }

        /* Design Customization Panel */
        .design-options {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
        }

        .design-toggle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .design-toggle:hover {
            transform: scale(1.1) rotate(15deg);
        }

        .options-panel {
            position: absolute;
            bottom: 60px;
            right: 0;
            width: 280px;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            display: none;
        }

        .dark-mode .options-panel {
            background: #1e293b;
        }

        .options-panel h4 {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--dark);
        }

        .dark-mode .options-panel h4 {
            color: #f1f5f9;
        }

        .option-group {
            margin-bottom: 20px;
        }

        .option-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--gray);
        }

        .color-options {
            display: flex;
            gap: 10px;
        }

        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .color-option:hover {
            transform: scale(1.2);
        }

        .radius-options {
            display: flex;
            gap: 8px;
        }

        .radius-option {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .radius-option:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .option-group input[type="range"] {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        .option-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            
            .logo {
                font-size: 3rem;
            }
            
            h1 {
                font-size: 1.7rem;
            }
            
            input, .btn-primary {
                padding: 16px;
            }
            
            .theme-toggle,
            .notification-bell {
                top: 15px;
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }
            
            .theme-toggle {
                left: 15px;
            }
            
            .notification-bell {
                right: 15px;
            }
            
            .design-toggle {
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }
            
            .options-panel {
                width: 260px;
                padding: 15px;
            }
            
            .quick-login-options {
                grid-template-columns: 1fr;
            }
        }

        /* تأثير الكتابة للنص */
        .typing-text {
            overflow: hidden;
            border-right: 2px solid var(--primary);
            white-space: nowrap;
            animation: typing 3.5s steps(40, end), blink-caret 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: var(--primary); }
        }
    </style>
</head>
<body>
    <!-- الخلفية المتحركة -->
    <div class="animated-bg gradient-bg"></div>
    
    <!-- Theme Toggle Button -->
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
        <i class="fas fa-moon" id="themeIcon"></i>
    </button>

    <!-- Notification Bell -->
    <button class="notification-bell" id="notificationBell" onclick="toggleNotifications()">
        <i class="fas fa-bell"></i>
        <span class="notification-count" id="notificationCount">3</span>
    </button>

    <div class="login-container fade-in-up">
        <div class="logo"><i class="fas fa-wallet"></i></div>
        
        <h1>Sudan Pay</h1>
        <p class="subtitle">سجل دخولك للوصول إلى محفظتك الرقمية الآمنة</p>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-step active">
                    <div class="step-number">1</div>
                    <div class="step-label">تسجيل الدخول</div>
                </div>
                <div class="progress-step">
                    <div class="step-number">2</div>
                    <div class="step-label">التحقق</div>
                </div>
                <div class="progress-step">
                    <div class="step-number">3</div>
                    <div class="step-label">لوحة التحكم</div>
                </div>
            </div>
        </div>

        <!-- Alert Box -->
        <div id="alert-box"></div>
        
        <!-- Email Input -->
        <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <button type="button" class="password-toggle" onclick="togglePassword()">
                <i class="fas fa-eye" id="eye-icon"></i>
            </button>
            <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            <div class="input-focus-effect"></div>
        </div>
        
        <!-- Password Input -->
        <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <div class="input-focus-effect"></div>
        </div>
        
        <!-- Login Button -->
        <button id="login-btn" class="btn-primary ripple pulse-effect" onclick="handleEmailLogin()">
            <i class="fas fa-sign-in-alt"></i> <span>تسجيل الدخول</span>
        </button>
        
        <!-- Divider -->
        <div class="divider"><span>أو</span></div>
        
        <!-- Google Sign-In Button -->
        <button id="google-btn" class="btn-primary btn-google ripple" onclick="handleGoogleLogin()">

        // نظام تتبع النشاط
        class ActivityTracker {
            constructor() {
                this.sessionStart = Date.now();
                this.clicks = 0;
                this.errors = 0;
                this.successes = 0;
            }
            
            trackClick(element) {
                this.clicks++;
                console.log(`Click on: ${element}, Total clicks: ${this.clicks}`);
            }
            
            trackError(type) {
                this.errors++;
                console.log(`Error: ${type}, Total errors: ${this.errors}`);
            }
            
            trackSuccess(action) {
                this.successes++;
                console.log(`Success: ${action}, Total successes: ${this.successes}`);
            }
            
            getSessionDuration() {
                return Math.floor((Date.now() - this.sessionStart) / 1000);
            }
        }

        const activityTracker = new ActivityTracker();

        // ==================== Alert System ====================
        function showAlert(message, type = 'error', duration = 5000) {
            const alertBox = document.getElementById('alert-box');
            
            // Clear previous alerts
            alertBox.innerHTML = '';
            
            // Create alert content
            alertBox.innerHTML = `
                <span>${message}</span>
                <button class="alert-close" onclick="this.parentElement.style.display='none'">
                    <i class="fas fa-times"></i>
                </button>
            `;
            
            // Set type and display
            alertBox.className = `alert-${type}`;
            alertBox.style.display = 'block';
            
            // Auto-hide for success/info messages
            if (type === 'success' || type === 'info') {
                setTimeout(() => {
                    alertBox.style.display = 'none';
                }, duration);
            }
            
            activityTracker.trackSuccess('Alert shown');
        }

        // ==================== Password Visibility Toggle ====================

                passwordInput.type = 'password';
                eyeIcon.className = 'fas fa-eye';
                eyeIcon.style.color = '';

            activityTracker.trackClick('Password toggle');
        };

        // ==================== Theme Toggle ====================
        window.toggleTheme = () => {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');

            if (isDarkMode) {
                body.classList.remove('dark-mode');

                showAlert('تم تفعيل الوضع الفاتح', 'info', 2000);

                body.classList.add('dark-mode');
                themeIcon.className = 'fas fa-sun';

                showAlert('تم تفعيل الوضع الليلي', 'info', 2000);
            }
            
            activityTracker.trackClick('Theme toggle');
        };

        // ==================== Design Customization ====================

            const panel = document.getElementById('optionsPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            activityTracker.trackClick('Design options toggle');
        };

        window.changePrimaryColor = (color) => {
            document.documentElement.style.setProperty('--primary', color);
            localStorage.setItem('primaryColor', color);
            activityTracker.trackSuccess('Primary color changed');
        };

        window.changeBorderRadius = (radius) => {
            document.documentElement.style.setProperty('--border-radius', radius);

        // ==================== Notification System ====================
        window.toggleNotifications = () => {
            const center = document.getElementById('notificationCenter');
            const isVisible = center.classList.contains('show');
            
            if (isVisible) {
                center.classList.remove('show');
                setTimeout(() => {
                    center.style.display = 'none';

                    center.classList.add('show');

            activityTracker.trackClick('Notifications toggle');

        async function loadNotifications() {
            const notificationList = document.getElementById('notificationList');

        // ==================== Quick Login Functions ====================
        window.quickLogin = async (type) => {

        // ==================== Login with Email/Password ====================
        async function handleEmailLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            
            // Validation
            if (!email || !password) {
                showAlert('يرجى ملء جميع الحقول المطلوبة', 'warning');
                document.getElementById('email').classList.add('shake');
                document.getElementById('password').classList.add('shake');
                setTimeout(() => {
                    document.getElementById('email').classList.remove('shake');
                    document.getElementById('password').classList.remove('shake');
                }, 500);
                activityTracker.trackError('Empty fields');
                return;
            }
            
            if (!validateEmail(email)) {
                showAlert('يرجى إدخال بريد إلكتروني صحيح', 'warning');
                document.getElementById('email').classList.add('shake');
                setTimeout(() => {
                    document.getElementById('email').classList.remove('shake');
                }, 500);
                activityTracker.trackError('Invalid email');
                return;
            }
            
            try {
                // Disable button and show loading
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<div class="loading"></div> جاري التحقق...';
                
                // Sign in with Firebase
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Check user data in Firestore
                const userDoc = await getDoc(doc(db, "users", user.uid));
                
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    const kycStatus = userData.kycStatus || 'not_submitted';
                    
                    // تحديث شريط التقدم
                    document.querySelector('.progress-bar::after').style.width = '66%';
                    document.querySelectorAll('.progress-step')[1].classList.add('active');
                    
                    // Handle KYC status
                    switch (kycStatus) {
                        case 'verified':
                            showAlert('✅ تم تسجيل الدخول بنجاح!', 'success');
                            document.querySelector('.progress-bar::after').style.width = '100%';
                            document.querySelectorAll('.progress-step')[2].classList.add('active');
                            setTimeout(() => {
                                window.location.href = 'dashboard.html';
                            }, 1500);
                            break;
                            
                        case 'pending':
                            showAlert('⏳ حسابك قيد المراجعة. يمكنك استخدام الخدمات الأساسية.', 'warning');
                            setTimeout(() => {
                                window.location.href = 'dashboard.html';
                            }, 2000);
                            break;
                            
                        case 'rejected':
                            showAlert('❌ تم رفض طلب التحقق. يرجى التواصل مع الدعم الفني.', 'error');
                            setTimeout(() => {
                                window.location.href = 'dashboard.html';
                            }, 3000);
                            break;
                            
                        default:
                            showAlert('مرحباً بك! يرجى إكمال التحقق من الهوية.', 'info');
                            setTimeout(() => {
                                window.location.href = 'kyc-verification.html';
                            }, 1500);
                    }
                } else {
                    // First-time user
                    showAlert('مرحباً بك! يرجى إكمال ملفك الشخصي.', 'success');
                    setTimeout(() => {
                        window.location.href = 'profile-setup.html';
                    }, 1500);
                }
                
                activityTracker.trackSuccess('Email login');
                
            } catch (error) {
                console.error('Login error:', error);
                
                // تأثير اهتزاز عند الخطأ
                document.getElementById('email').classList.add('shake');
                document.getElementById('password').classList.add('shake');
                setTimeout(() => {
                    document.getElementById('email').classList.remove('shake');
                    document.getElementById('password').classList.remove('shake');
                }, 500);
                
                // User-friendly error messages
                let errorMessage = 'حدث خطأ أثناء تسجيل الدخول';
                
                switch (error.code) {
                    case 'auth/invalid-email':
                        errorMessage = 'البريد الإلكتروني غير صحيح';
                        break;
                    case 'auth/user-disabled':
                        errorMessage = 'هذا الحساب معطل';
                        break;
                    case 'auth/user-not-found':
                        errorMessage = 'لا يوجد حساب مرتبط بهذا البريد';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = 'كلمة المرور غير صحيحة';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = 'محاولات دخول كثيرة، حاول لاحقاً';
                        break;
                    case 'auth/network-request-failed':
                        errorMessage = 'خطأ في الاتصال بالشبكة';
                        break;
                }
                
                showAlert(`❌ ${errorMessage}`, 'error');
                activityTracker.trackError(`Login error: ${error.code}`);
                
            } finally {
                // Reset button state
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>تسجيل الدخول</span>';
            }
        }

        // ==================== Google Sign-In ====================
        async function handleGoogleLogin() {
            const googleBtn = document.getElementById('google-btn');
            
            try {
                // Disable button and show loading
                googleBtn.disabled = true;
                googleBtn.innerHTML = '<div class="loading"></div> جاري الاتصال...';
                
                // Sign in with Google
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;
                
                // تحديث شريط التقدم
                document.querySelector('.progress-bar::after').style.width = '66%';
                document.querySelectorAll('.progress-step')[1].classList.add('active');
                
                // Check if user exists in Firestore
                const userDoc = await getDoc(doc(db, "users", user.uid));
                
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    showAlert(`مرحباً ${userData.name || user.displayName}!`, 'success');
                    document.querySelector('.progress-bar::after').style.width = '100%';
                    document.querySelectorAll('.progress-step')[2].classList.add('active');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    // New Google user - redirect to complete profile
                    showAlert('مرحباً! يرجى إكمال معلومات حسابك.', 'info');
                    setTimeout(() => {
                        window.location.href = 'complete-profile.html';
                    }, 1500);
                }
                
                activityTracker.trackSuccess('Google login');
                
            } catch (error) {
                console.error('Google sign-in error:', error);
                
                let errorMessage = 'فشل الدخول بحساب Google';
                
                if (error.code === 'auth/popup-closed-by-user') {
                    errorMessage = 'تم إغلاق نافذة الدخول';
                } else if (error.code === 'auth/account-exists-with-different-credential') {
                    errorMessage = 'يوجد حساب بنفس البريد الإلكتروني بطريقة تسجيل أخرى';
                }
                
                showAlert(`❌ ${errorMessage}`, 'error');
                activityTracker.trackError(`Google login error: ${error.code}`);
                
            } finally {
                // Reset button state
                googleBtn.disabled = false;
                googleBtn.innerHTML = '<i class="fab fa-google" style="color: #4285F4;"></i> الدخول بجوجل';
            }
        }

        // ==================== Password Reset ====================
        window.resetPassword = async () => {
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                showAlert('يرجى إدخال البريد الإلكتروني أولاً', 'warning');
                document.getElementById('email').focus();
                activityTracker.trackError('Password reset - empty email');
                return;
            }
            
            if (!validateEmail(email)) {
                showAlert('يرجى إدخال بريد إلكتروني صحيح', 'warning');
                activityTracker.trackError('Password reset - invalid email');
                return;
            }
            
            if (confirm(`هل تريد إرسال رابط إعادة تعيين كلمة المرور إلى:\n${email}`)) {
                try {
                    await sendPasswordResetEmail(auth, email);
                    showAlert('✅ تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني', 'success');
                    activityTracker.trackSuccess('Password reset email sent');
                } catch (error) {
                    console.error('Password reset error:', error);
                    showAlert('❌ فشل في إرسال الرابط، تأكد من صحة البريد', 'error');
                    activityTracker.trackError('Password reset failed');
                }
            }
        };

        // ==================== Helper Functions ====================
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function loadDesignPreferences() {
            const savedTheme = localStorage.getItem('theme');
            const savedColor = localStorage.getItem('primaryColor');
            const savedRadius = localStorage.getItem('borderRadius');
            const savedShadow = localStorage.getItem('shadowIntensity');
            
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeIcon').className = 'fas fa-sun';
            }
            
            if (savedColor) {
                document.documentElement.style.setProperty('--primary', savedColor);
            }
            
            if (savedRadius) {
                document.documentElement.style.setProperty('--border-radius', savedRadius);
            }
            
            if (savedShadow) {
                const shadow = `0 ${savedShadow}px ${savedShadow*2}px rgba(0, 0, 0, 0.${savedShadow})`;
                document.querySelector('.login-container').style.boxShadow = shadow;
            }
        }

        function checkAutoFill() {
            setTimeout(() => {
                const emailInput = document.getElementById('email');
                const passwordInput = document.getElementById('password');
                
                if (emailInput.value) {
                    emailInput.style.background = '#f0fdf4';
                }
                
                if (passwordInput.value) {
                    passwordInput.style.background = '#f0fdf4';
                }
            }, 100);
        }

        // ==================== Event Listeners ====================
        // تتبع جميع النقرات
        document.addEventListener('click', (e) => {
            const element = e.target.tagName + (e.target.id ? `#${e.target.id}` : 
                             e.target.className ? `.${e.target.className.split(' ')[0]}` : '');
            activityTracker.trackClick(element);
        });

        // Enter key support
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                activityTracker.trackClick('Enter key on password');
                handleEmailLogin();
            }
        });

        // ==================== Initialize ====================
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize design preferences
            loadDesignPreferences();
            
            // Check for autofill
            checkAutoFill();
            
            // Load initial notifications
            loadNotifications();
            
            // Check if user is already logged in
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    // User is already logged in, redirect to dashboard
                    window.location.href = 'dashboard.html';
                }
            });
            
            // Welcome message
            setTimeout(() => {
                if (!localStorage.getItem('welcomeShown')) {
                    showAlert('مرحباً بك في Sudan Pay - المحفظة الرقمية الآمنة', 'info', 3000);
                    localStorage.setItem('welcomeShown', 'true');
                }
            }, 1000);
            
            console.log('Sudan Pay Login Page Initialized');
        });

        // ==================== Global Error Handling ====================
        window.addEventListener('error', (event) => {
            console.error('Global error:', event.error);
            showAlert('حدث خطأ غير متوقع، يرجى تحديث الصفحة', 'error');
            activityTracker.trackError('Global error');
        });

        // ==================== Network Status ====================
        window.addEventListener('online', () => {
            showAlert('تم استعادة الاتصال بالإنترنت', 'success', 2000);
            activityTracker.trackSuccess('Network online');
        });

        window.addEventListener('offline', () => {
            showAlert('تم فقد الاتصال بالإنترنت', 'warning', 0);
            activityTracker.trackError('Network offline');
        });

        // عند الخروج من الصفحة
        window.addEventListener('beforeunload', () => {
            const duration = activityTracker.getSessionDuration();
            console.log(`Session ended after ${duration} seconds. 
                         Clicks: ${activityTracker.clicks}, 
                         Errors: ${activityTracker.errors}, 
                         Successes: ${activityTracker.successes}`);
        });
    </script>
</body>
    </html>
