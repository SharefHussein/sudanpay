<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudan Pay - تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Cairo', sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
      padding: 20px;
    }
    .login-container {
      background: white;
      width: 90%;
      max-width: 400px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
      padding: 40px 30px;
      text-align: center;
    }
    .logo {
      font-size: 48px;
      color: #0d9488;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      color: #2c3e50;
      margin-bottom: 10px;
    }
    p {
      color: #7f8c8d;
      margin-bottom: 30px;
      font-size: 16px;
    }
    .input-group {
      margin-bottom: 20px;
      position: relative;
    }
    input {
      width: 100%;
      padding: 15px 45px 15px 15px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s;
    }
    input:focus {
      border-color: #0d9488;
      outline: none;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
    }
    .input-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
    }
    .password-toggle {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 16px;
      padding: 5px;
    }
    .btn-primary {
      background: linear-gradient(to right, #0d9488, #0f766e);
      color: white;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 7px 14px rgba(13, 148, 136, 0.2);
    }
    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .btn-google {
      background: white;
      color: #333;
      border: 2px solid #ddd;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s;
    }
    .btn-google:hover:not(:disabled) {
      background: #f8f9fa;
      border-color: #ccc;
      transform: translateY(-2px);
    }
    .btn-google:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: #888;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #ddd;
    }
    .divider span {
      padding: 0 15px;
    }
    .link {
      color: #0d9488;
      text-decoration: none;
      font-weight: bold;
    }
    .link:hover {
      text-decoration: underline;
    }
    .mt-20 {
      margin-top: 20px;
    }
    .fa-eye, .fa-eye-slash {
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <i class="fas fa-wallet"></i>
    </div>
    <h1>مرحباً بك في Sudan Pay</h1>
    <p>سجل دخولك للوصول إلى محفظتك</p>
    
    <div class="input-group">
      <i class="fas fa-envelope input-icon"></i>
      <input type="email" id="email" placeholder="البريد الإلكتروني" required>
    </div>
    
    <div class="input-group">
      <i class="fas fa-lock input-icon"></i>
      <button type="button" class="password-toggle">
        <i class="fas fa-eye"></i>
      </button>
      <input type="password" id="password" placeholder="كلمة المرور" required>
    </div>
    
    <button id="login-btn" class="btn-primary">
      <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
    </button>
    
    <div class="divider">
      <span>أو</span>
    </div>
    
    <button id="google-btn" class="btn-google">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
      الدخول بجوجل
    </button>
    
    <p class="mt-20">
      ليس لديك حساب؟ <a href="signup.html" id="signup-link" class="link">إنشاء حساب جديد</a>
    </p>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
