<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudan Pay - محفظتك الرقمية الأولى</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; font-family: 'Cairo', sans-serif; color: white; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        .hero-glow {
            position: absolute; top: -10%; left: 50%; transform: translateX(-50%);
            width: 300px; height: 300px; background: #a3e635;
            filter: blur(150px); opacity: 0.15; z-index: -1;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div class="hero-glow"></div>

    <header class="p-8 text-center">
        <h1 class="text-4xl font-black italic tracking-tighter">
            Sudan<span class="text-[#a3e635]">Pay</span>
        </h1>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center px-8 text-center">
        <div class="w-24 h-24 mb-8 glass rounded-[30px] flex items-center justify-center text-[#a3e635] text-4xl shadow-2xl shadow-lime-500/10 animate-bounce">
            <i class="fas fa-wallet"></i>
        </div>

        <h2 class="text-3xl font-black mb-4 leading-tight">
            مستقبل التحويلات <br> <span class="text-[#a3e635]">بين يديك الآن</span>
        </h2>
        
        <p class="text-gray-400 text-sm mb-12 max-w-xs leading-relaxed">
            أسرع وأسهل طريقة لإرسال واستلام الأموال في السودان بكل أمان وثقة.
        </p>

        <div class="w-full max-w-xs space-y-4">
            <a href="login.html" class="block w-full py-4 bg-[#a3e635] text-black font-black rounded-2xl shadow-lg shadow-lime-500/20 transition active:scale-95">
                تسجيل الدخول
            </a>
            
            <a href="signup.html" class="block w-full py-4 glass text-white font-bold rounded-2xl border border-white/10 transition active:scale-95">
                إنشاء حساب جديد
            </a>
        </div>
    </main>

    <footer class="p-8 text-center">
        <div class="flex justify-center gap-6 mb-4 text-gray-500 text-lg">
            <i class="fab fa-instagram"></i>
            <i class="fab fa-twitter"></i>
            <i class="fab fa-facebook"></i>
        </div>
        <p class="text-[10px] text-gray-600 font-bold uppercase tracking-widest">
            &copy; 2025 Sudan Pay Digital Wallet
        </p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="app.js"></script>
    <script>
        // إذا كان المستخدم مسجل دخول بالفعل، نوجهه للداشبورد مباشرة
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = "dashboard.html";
            }
        });
    </script>
</body>
</html>
