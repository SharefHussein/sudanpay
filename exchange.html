<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudan Pay - التبادل الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .exchange-card { background: white; border-radius: 25px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .rate-badge { background: #f0fdf4; color: #16a34a; padding: 8px 15px; border-radius: 50px; font-size: 0.85rem; display: inline-block; margin-bottom: 15px; font-weight: 700; }
        .input-box { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 15px; padding: 15px; margin-bottom: 15px; transition: 0.3s; }
        .input-box:focus-within { border-color: var(--primary); background: white; }
        .input-box label { display: block; font-size: 0.8rem; color: #64748b; margin-bottom: 5px; }
        .input-box input { width: 100%; border: none; background: transparent; font-size: 1.4rem; font-weight: 800; outline: none; }
        .swap-icon { width: 40px; height: 40px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: -10px auto 10px; position: relative; z-index: 2; border: 4px solid white; cursor: pointer; }
        .status-box { padding: 15px; border-radius: 12px; font-size: 0.85rem; margin-top: 15px; display: none; }
        .status-success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <a href="dashboard.html" class="navbar-brand"><i class="fas fa-arrow-right"></i> العودة</a>
            <span class="text-primary font-bold">تحويل العملات</span>
        </nav>

        <div class="exchange-card">
            <div class="text-center">
                <div class="rate-badge" id="liveRate">جاري جلب سعر الصرف...</div>
            </div>

            <div id="converter-ui">
                <div class="input-box">
                    <label>إرسال (USDT)</label>
                    <input type="number" id="usdtInput" placeholder="0.00" oninput="calculateExchange('usdt')">
                </div>

                <div class="swap-icon"><i class="fas fa-retweet"></i></div>

                <div class="input-box">
                    <label>استلام (SDG)</label>
                    <input type="number" id="sdgInput" placeholder="0.00" oninput="calculateExchange('sdg')">
                </div>
            </div>

            <button class="btn btn-primary w-full mt-4" id="actionBtn" onclick="initiateExchange()">
                <i class="fas fa-bolt"></i> تحويل الآن أوتوماتيكياً
            </button>

            <div id="statusBox" class="status-box"></div>
        </div>

        <div id="depositInfo" class="card mt-4" style="display: none;">
            <h4 class="font-bold mb-2">عنوان الإيداع (TRC20)</h4>
            <p class="text-gray text-sm mb-3">أرسل المبلغ للعنوان أدناه، وسيتم إضافة الرصيد لحسابك فور تأكيد الشبكة.</p>
            <div class="p-3 bg-gray rounded-lg break-all font-mono text-sm" id="walletAddr">TXXXXX....XXXXX</div>
            <button class="btn btn-outline btn-sm mt-3 w-full" onclick="copyWallet()"><i class="fas fa-copy"></i> نسخ العنوان</button>
        </div>
    </div>

    <script type="module">
        import { auth, db, getUserData, showAlert } from './app.js';
        import { doc, updateDoc, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        let currentRate = 0;
        let userData = null;

        // 1. جلب سعر الصرف أوتوماتيكياً (USDT/SDG)
        async function fetchLiveRate() {
            try {
                // ملاحظة: بما أن السوداني غير متوفر في معظم الـ APIs العالمية، سنقوم بجلب سعر USDT/USD 
                // ثم نضربه في سعر الدولار في السودان (يمكنك ربط هذا بـ API محلي لاحقاً)
                const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=usd');
                const data = await response.json();
                const usdtInUsd = data.tether.usd;
                
                // سعر الدولار التقريبي في السودان (يمكنك جعله متغير من لوحة التحكم)
                const sdgRate = 2600; 
                currentRate = usdtInUsd * sdgRate;

                document.getElementById('liveRate').innerHTML = `<i class="fas fa-chart-line"></i> 1 USDT = ${currentRate.toLocaleString()} SDG`;
            } catch (error) {
                console.error("خطأ في جلب السعر:", error);
                document.getElementById('liveRate').textContent = "السعر الحالي: 2,600 SDG (تقديري)";
                currentRate = 2600;
            }
        }

        // 2. حساب المبالغ لحظياً
        window.calculateExchange = (type) => {
            const usdtIn = document.getElementById('usdtInput');
            const sdgIn = document.getElementById('sdgInput');

            if (type === 'usdt') {
                sdgIn.value = (usdtIn.value * currentRate).toFixed(2);
            } else {
                usdtIn.value = (sdgIn.value / currentRate).toFixed(4);
            }
        };

        // 3. بدء عملية التبادل
        window.initiateExchange = async () => {
            const amount = document.getElementById('usdtInput').value;
            if (!amount || amount <= 0) return showAlert('أدخل مبلغ صحيح', 'error');

            const statusBox = document.getElementById('statusBox');
            const depositInfo = document.getElementById('depositInfo');

            statusBox.style.display = 'block';
            statusBox.className = 'status-box status-success';
            statusBox.innerHTML = `<i class="fas fa-spinner fa-spin"></i> جاري إنشاء عنوان إيداع آمن...`;

            // محاكاة الربط مع Blockchain API لتوليد عنوان
            setTimeout(() => {
                const mockWallet = "T" + Math.random().toString(36).substring(2, 15).toUpperCase();
                document.getElementById('walletAddr').textContent = mockWallet;
                depositInfo.style.display = 'block';
                statusBox.innerHTML = `<i class="fas fa-clock"></i> في انتظار وصول ${amount} USDT إلى المحفظة...`;
                
                // هنا تبدأ وظيفة المراقبة (Auto-monitor)
                startMonitoring(mockWallet, amount);
            }, 2000);
        };

        // 4. مراقبة وصول المال (أوتوماتيك)
        function startMonitoring(address, expectedAmount) {
            // في الواقع سنستخدم Webhook أو setInterval لفحص البلوكشين عبر Tatum.io
            console.log("Monitoring address:", address);
            
            // محاكاة وصول المال بعد 10 ثواني للتجربة
            setTimeout(async () => {
                const user = auth.currentUser;
                const finalSdg = expectedAmount * currentRate;

                try {
                    const userRef = doc(db, "users", user.uid);
                    await updateDoc(userRef, {
                        balanceSDG: increment(finalSdg),
                        transactions: arrayUnion({
                            type: 'receive',
                            amount: finalSdg,
                            description: `تبادل USDT أوتوماتيكي`,
                            timestamp: new Date().toISOString()
                        })
                    });

                    document.getElementById('statusBox').innerHTML = `<i class="fas fa-check-circle"></i> تم الاستلام! تمت إضافة ${finalSdg.toLocaleString()} SDG لرصيدك.`;
                    showAlert('تم شحن رصيدك بنجاح', 'success');
                } catch (e) {
                    console.error(e);
                }
            }, 15000);
        }

        window.copyWallet = () => {
            navigator.clipboard.writeText(document.getElementById('walletAddr').textContent);
            showAlert('تم نسخ العنوان');
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                fetchLiveRate();
                userData = await getUserData(user.uid);
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
