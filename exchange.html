<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيداع USDT - SudanPay</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; text-align: center; padding: 20px; color: #333; }
        .container { background: white; max-width: 450px; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; }
        .wallet-box { background: #e8f0fe; padding: 15px; border-radius: 8px; margin: 20px 0; word-break: break-all; font-weight: bold; border: 1px dashed #1a73e8; }
        button { background-color: #28a745; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 18px; width: 100%; transition: 0.3s; }
        button:hover { background-color: #218838; }
        #status { margin-top: 20px; font-size: 14px; min-height: 40px; }
        .loader { color: #1a73e8; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>إيداع USDT (TRC20)</h2>
    <p>قم بتحويل مبلغ الإيداع إلى عنوان محفظتك أدناه:</p>
    
    <div id="wallet-address" class="wallet-box">جاري تحميل عنوانك...</div>

    <button onclick="verifyDeposit()">تأكيد وصول الإيداع</button>

    <div id="status">اضغط على الزر بعد إتمام التحويل من محفظتك.</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyB3vxJu_et-P80ek30I3MRdC_lGhooCCsc",
        authDomain: "sudanpay-e332a.firebaseapp.com",
        projectId: "sudanpay-e332a",
        storageBucket: "sudanpay-e332a.firebasestorage.app",
        messagingSenderId: "699809447272",
        appId: "1:699809447272:web:90f3780ed6c768c4322add",
        measurementId: "G-XRN6CBLKXY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // مفتاح Tatum المين نت (تأكد من وضعه هنا)
    const TATUM_API_KEY = "t-695a0ea026858bd739f1595e-363e1ef7ec404868aebf73ed"; 

    let currentUserAddress = "";

    // التأكد من تسجيل الدخول وجلب عنوان المحفظة
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);
            if (userSnap.exists()) {
                currentUserAddress = userSnap.data().usdtAddress;
                document.getElementById('wallet-address').innerText = currentUserAddress;
            }
        } else {
            document.getElementById('wallet-address').innerText = "يرجى تسجيل الدخول أولاً";
        }
    });

    // دالة فحص البلوكشين وتحديث الرصيد
    async function verifyDeposit() {
        const statusDiv = document.getElementById('status');
        if (!currentUserAddress) { alert("لم يتم العثور على عنوان محفظة!"); return; }

        statusDiv.innerHTML = '<span class="loader">جاري فحص البلوكشين... قد يستغرق ذلك دقيقة.</span>';

        try {
            // الاتصال بـ Tatum لفحص الرصيد
            const response = await fetch(`https://api.tatum.io/v3/tron/account/${currentUserAddress}`, {
                method: 'GET',
                headers: { 'x-api-key': TATUM_API_KEY }
            });
            const data = await response.json();

            // البحث عن رصيد USDT (عقد USDT على شبكة ترون ثابت)
            const usdtToken = data.trc20.find(t => t.tokenAddress === "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t");
            const balance = usdtToken ? parseFloat(usdtToken.value) : 0;

            if (balance > 0) {
                // تحديث رصيد المستخدم في Firebase (تحويل USDT لجنيه سوداني)
                const amountInSDG = balance * 2600; // سعر الصرف الخاص بك
                const userRef = doc(db, "users", auth.currentUser.uid);
                
                await updateDoc(userRef, {
                    balanceSDG: increment(amountInSDG),
                    lastDeposit: balance,
                    status: "active"
                });

                statusDiv.innerHTML = `<b style="color:green;">✅ تم الإيداع بنجاح! تم إضافة ${amountInSDG} جنيه لرصيدك.</b>`;
                alert("تم تحديث رصيدك بنجاح!");
            } else {
                statusDiv.innerHTML = '<b style="color:red;">❌ لم يتم العثور على رصيد جديد في المحفظة بعد.</b>';
            }
        } catch (error) {
            console.error(error);
            statusDiv.innerText = "خطأ في الاتصال بالشبكة، حاول مرة أخرى.";
        }
    }

    window.verifyDeposit = verifyDeposit;
</script>

</body>
</html>
